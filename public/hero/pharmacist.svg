  <rect x="348" y="376" width="62" height="5" fill="#d5dbe7"/>
  <rect x="358" y="398" width="42" height="42" rx="3" fill="#fffaf0"/>
  <rect x="363" y="405" width="20" height="5" rx="2" fill="#284577"/>
  <rect x="363" y="414" width="31" height="3" rx="1.5" fill="#95b1d8"/>
