      <stop offset="0.35" stop-color="#d0852f"/>
      <stop offset="0.55" stop-color="#e3a052"/>
      <stop offset="1" stop-color="#9a5418"/>
    </linearGradient>
    <linearGradient id="skinShade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b87752"/>
      <stop offset="1" stop-color="#c98a64"/>
    </linearGradient>
    <clipPath id="archClip">
