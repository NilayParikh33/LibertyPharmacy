      <rect x="400" y="342" width="22" height="40" rx="4" fill="#c98a3a"/><rect x="398" y="334" width="26" height="10" rx="3" fill="#e9eef6"/>
      <rect x="428" y="330" width="48" height="52" rx="3" fill="#5f84bf"/><rect x="434" y="344" width="36" height="14" rx="2" fill="#a9c2e6"/>
