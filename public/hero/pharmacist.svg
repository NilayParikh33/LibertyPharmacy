<svg xmlns="http://www.w3.org/2000/svg" viewBox="100 64 400 656" role="img" aria-label="Illustration of a pharmacist holding a prescription bottle">
  <defs>
    <linearGradient id="arch" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2f5592"/>
      <stop offset="1" stop-color="#1b2a47"/>
    </linearGradient>
    <linearGradient id="coat" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e3e8f1"/>
      <stop offset="0.35" stop-color="#f8fafd"/>
      <stop offset="0.7" stop-color="#f3f6fa"/>
      <stop offset="1" stop-color="#d6dce8"/>
    </linearGradient>
    <linearGradient id="sleeve" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#d5dbe7"/>
      <stop offset="0.6" stop-color="#eef2f7"/>
      <stop offset="1" stop-color="#dfe4ee"/>
    </linearGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="1" y2="0">
