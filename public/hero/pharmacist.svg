      <rect x="462" y="210" width="24" height="52" rx="5" fill="#6f93c9"/><rect x="460" y="202" width="28" height="11" rx="3" fill="#e9eef6"/>
      <rect x="120" y="334" width="44" height="48" rx="3" fill="#4d74b0"/><rect x="126" y="346" width="32" height="14" rx="2" fill="#8fb0dd"/>
      <rect x="170" y="344" width="22" height="38" rx="4" fill="#c98a3a"/><rect x="168" y="336" width="26" height="10" rx="3" fill="#e9eef6"/>
